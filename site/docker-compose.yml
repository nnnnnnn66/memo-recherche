services:
  mysql:
    image: mysql:8.0
    container_name: memoire-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: memoire_recherche
      MYSQL_USER: memoire_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-memoire_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max-connections=200
      # Requis pour créer les triggers "zéro perte" avec un utilisateur non-root
      - --log-bin-trust-function-creators=1
    ports:
      # Lié à 127.0.0.1 uniquement : la base n'est jamais exposée sur internet
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - memoire_mysql_data:/var/lib/mysql
      - ./ops/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  memoire_mysql_data:
